<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Ролики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0b0b0d; --card: #16161a; --card2: #1e1e24; --line: #2a2a31; --text: #f2f2f4; --mute: #8d8d98;
  --accent: #ffd60a; --green: #34c759; --red: #ff453a; --blue: #0a84ff; --orange: #ff9f0a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 5; background: rgba(11,11,13,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 10px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.3px; flex: 1; }
.upd { color: var(--mute); font-size: 12px; }
.search { margin-top: 10px; display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; width: 100%; background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 11px 14px;
  font-size: 17px; outline: none; }
.search input:focus { border-color: #4a4a55; }
.lang { display: flex; flex: none; background: var(--card2); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.lang button { background: none; border: 0; color: var(--mute); padding: 0 10px; min-width: 40px; font-weight: 600; font-size: 14px; }
.lang button.on { color: #000; background: var(--text); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: var(--card2); border: 1px solid var(--line); color: var(--mute); border-radius: 999px; padding: 7px 12px;
  font-size: 14px; font-weight: 600; white-space: nowrap; }
.tab b { color: var(--text); margin-left: 4px; }
.tab.on { background: var(--text); color: #000; border-color: var(--text); }
.tab.on b { color: #000; }
.tabs.sub { margin-top: 8px; }
.tabs.sub:empty { display: none; }
.tabs.sub .tab { padding: 5px 10px; font-size: 13px; }
.tab i { font-style: normal; color: var(--mute); font-size: 11px; margin-left: 5px; }
.tab.on i { color: #333; }
.tab[data-t="status"] { background: rgba(10,132,255,.18); border-color: rgba(10,132,255,.5); color: #7cbcff; }
.tab[data-t="status"] b { color: #cfe6ff; }
.tab[data-t="status"].on { background: var(--blue); border-color: var(--blue); color: #fff; }
.tab[data-t="status"].on b { color: #fff; }
main { padding: 12px 16px 40px; }
.group { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; margin: 16px 2px 8px; }
.item { display: flex; gap: 12px; background: var(--card); border-radius: 16px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--line); }
.thumb { width: 64px; height: 114px; border-radius: 10px; background: var(--card2) center/cover; flex: none; position: relative; overflow: hidden; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); font-size: 22px; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.num { font-weight: 800; font-size: 17px; letter-spacing: -.2px; }
.tg { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
.hook { font-size: 14px; color: #d6d6dc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--mute); }
.chip.you { background: rgba(255,214,10,.16); color: var(--accent); }
.chip.work { background: rgba(10,132,255,.16); color: #5eb0ff; }
.chip.queue { background: rgba(141,141,152,.16); }
.chip.failed { background: rgba(255,69,58,.15); color: #ff7a71; }
.chip.done { background: rgba(52,199,89,.15); color: #5fdb7f; }
.scores { display: flex; gap: 4px; }
.sc { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 6px; background: var(--card2); font-variant-numeric: tabular-nums; }
.sc.g { color: #5fdb7f; } .sc.y { color: var(--accent); } .sc.r { color: #ff7a71; }
.step { font-size: 12px; color: #5eb0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--mute); text-align: center; padding: 50px 20px; }
/* detail */
.sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
.sheet.on { display: block; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: rgba(11,11,13,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.back { background: var(--card2); border: 0; color: var(--text); font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 10px; }
.bar .t { font-weight: 800; flex: 1; font-size: 17px; }
.nav { background: var(--card2); border: 0; color: var(--text); font-size: 18px; width: 38px; height: 36px; border-radius: 10px; }
.wrap { padding: 12px 16px 60px; max-width: 560px; margin: 0 auto; }
.player { width: 100%; aspect-ratio: 9/16; max-height: 72vh; background: #000; border-radius: 16px; overflow: hidden; display: grid; place-items: center;
  margin: 0 auto; }
.player video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.player .ld { color: var(--mute); }
.acts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.btn { border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; color: var(--text); background: var(--card2); text-align: center; }
.btn.main { background: var(--accent); color: #000; }
.btn.good { background: var(--green); color: #000; }
.btn.bad { background: rgba(255,69,58,.15); color: #ff7a71; }
.btn:active { transform: scale(.98); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
.box h3 { margin: 0 0 8px; font-size: 13px; color: var(--mute); text-transform: uppercase; letter-spacing: .5px; }
.speech { border-color: rgba(255,214,10,.35); }
.pack { white-space: pre-wrap; font-size: 14px; color: #dcdce2; word-break: break-word; }
.pack.cl { max-height: 260px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.more { background: none; border: 0; color: var(--blue); font-size: 14px; font-weight: 600; padding: 8px 0 0; }
textarea, .tinput { width: 100%; background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 12px;
  font: inherit; font-size: 16px; resize: vertical; outline: none; }
textarea { min-height: 110px; }
.form { display: none; flex-direction: column; gap: 8px; }
.form.on { display: flex; }
.hint { font-size: 12px; color: var(--mute); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30; background: #f2f2f4; color: #000;
  border-radius: 14px; padding: 13px 16px; font-weight: 600; transform: translateY(150%); transition: transform .25s, opacity .25s;
  opacity: 0; visibility: hidden; pointer-events: none; }
.toast.on { transform: none; opacity: 1; visibility: visible; }
.rf { background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; width: 34px; height: 30px; font-size: 16px; }
.ptr { height: 0; overflow: hidden; text-align: center; color: var(--mute); font-size: 13px; transition: height .2s; }
.kw { cursor: pointer; border-radius: 4px; padding: 0 1px; }
.kw.on { background: var(--accent); color: #000; }
.pend { background: rgba(10,132,255,.18); color: #7cbcff; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary h3::after { content: " ›"; }
details[open] > summary h3::after { content: " ⌄"; }
.lock { padding: 80px 24px; text-align: center; color: var(--mute); }
.up { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 8; width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(30,30,36,.95); color: var(--text); font-size: 22px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.up.on { display: block; }
.new { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.srow { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
.srow .num { font-size: 15px; }
.srow .what { font-size: 13px; color: #d6d6dc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .when { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.srow .go { color: var(--mute); font-size: 18px; }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pl 1.6s infinite; }
@keyframes pl { 50% { opacity: .3; } }
  #bigv { position: fixed; inset: 0; z-index: 9999; background: #000; display: grid; place-items: center; }
  #bigv video { width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; background: #000; }
  .bigx { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 16px; z-index: 100; width: 44px; height: 44px;
    border-radius: 22px; border: 0; background: rgba(255,255,255,.2); color: #fff; font-size: 22px; }
.pubs { margin-top: 6px; font-size: 13px; line-height: 1.5; }
.pub.out { color: var(--text, inherit); } .pub.fail { color: #e5484d; } .pub .mute { opacity: .6; } .pub a { margin-left: 4px; }

/* 20.10: «📅 Календарь»: when what came out on which platform and what is next */
.cal-sum { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; }
.cal-t { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; min-width: 0; text-align: left; color: var(--text); font: inherit; }
.cal-t .k { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .5px; }
.cal-t .v { font-size: 22px; font-weight: 800; letter-spacing: -.4px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.cal-t .s { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-t.nx .v { color: var(--accent); }
.cal-ctl { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.cal-seg { display: flex; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal-seg button { background: none; border: 0; color: var(--mute); font-weight: 600; font-size: 13px; padding: 7px 12px; }
.cal-seg button.on { background: var(--text); color: #000; }
.cal-today { margin-left: auto; background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 13px; }
.cal-warn { background: rgba(255,69,58,.15); color: #ff7a71; border: 0; border-radius: 10px; padding: 7px 10px; font-weight: 700; font-size: 13px; }
.cal-pf { display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px; scrollbar-width: none; }
.cal-pf::-webkit-scrollbar { display: none; }
.cal-pf button { flex: none; display: flex; align-items: center; gap: 6px; background: var(--card2); border: 1px solid var(--line); color: var(--mute); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.cal-pf button.on { background: var(--text); color: #000; border-color: var(--text); }
.cdot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.cal-strip { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 2px 16px 4px; scroll-snap-type: x proximity; scrollbar-width: none; }
.cal-strip::-webkit-scrollbar { display: none; }
.cal-d { flex: none; width: 50px; scroll-snap-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 7px 0 6px; text-align: center; color: var(--text); font: inherit; }
.cal-d .w { font-size: 11px; color: var(--mute); text-transform: uppercase; }
.cal-d .n { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
.cal-d .ds { display: flex; justify-content: center; gap: 2px; height: 7px; margin-top: 3px; }
.cal-d .ds .cdot { width: 5px; height: 5px; }
.cal-d .c { font-size: 10px; color: var(--mute); height: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.cal-d.past { opacity: .62; }
.cal-d.empty .n { color: var(--mute); }
.cal-d.td { border-color: var(--accent); }
.cal-d.td .w { color: var(--accent); }
.cal-d.on { background: var(--text); border-color: var(--text); color: #000; opacity: 1; }
.cal-d.on .w, .cal-d.on .c, .cal-d.on.empty .n { color: #333; }
.cal-mh { display: flex; align-items: center; margin-top: 12px; }
.cal-mh b { flex: 1; text-align: center; font-size: 15px; }
.cal-mh button { background: var(--card2); border: 0; color: var(--text); width: 38px; height: 32px; border-radius: 10px; font-size: 18px; }
.cal-mg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.cal-mg .wh { font-size: 11px; color: var(--mute); text-align: center; text-transform: uppercase; }
.cal-m { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 52px; padding: 4px 2px; text-align: center; color: var(--text); font: inherit; min-width: 0; }
.cal-m .n { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-m .ds { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; min-height: 6px; margin-top: 2px; }
.cal-m .ds .cdot { width: 5px; height: 5px; }
.cal-m .c { font-size: 10px; color: var(--mute); }
.cal-m.past { opacity: .62; }
.cal-m.td { border-color: var(--accent); }
.cal-m.on { background: var(--text); color: #000; border-color: var(--text); opacity: 1; }
.cal-m.on .c { color: #333; }
.cal-m.x { visibility: hidden; }
.cal-dh { display: flex; align-items: baseline; gap: 8px; margin: 18px 2px 8px; }
.cal-dh b { font-size: 17px; letter-spacing: -.2px; }
.cal-dh span { color: var(--mute); font-size: 13px; }
.cal-r { display: grid; grid-template-columns: 50px 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; margin-bottom: 8px; }
.cal-r.past { background: transparent; }
.cal-r .tm { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.cal-r .tm i { display: block; font-style: normal; font-size: 11px; color: var(--mute); font-weight: 600; }
.cal-r .lb { font-weight: 800; font-size: 15px; }
.cal-r .hk { font-size: 13px; color: #c9c9d0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.cal-r .cps { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.cp { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--card2); color: var(--text); text-decoration: none; border: 1px solid transparent; }
.cp.out { background: rgba(52,199,89,.13); color: #7fe39a; }
.cp.out.lnk { border-color: rgba(52,199,89,.45); }
.cp.fail { background: rgba(255,69,58,.15); color: #ff7a71; }
.cp.plan { color: #d6d6dc; }
.cp .mute { opacity: .65; font-weight: 600; }
.cal-now { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 12px; font-weight: 700; margin: 4px 0 10px; }
.cal-now::after { content: ""; flex: 1; height: 1px; background: var(--accent); opacity: .6; }
.cal-empty { color: var(--mute); text-align: center; padding: 30px 10px; }
.cal-empty button { margin-top: 12px; background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; }
.cal-hint { color: var(--mute); font-size: 11px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Ролики</h1><span class="upd" id="upd"></span><button class="rf" id="rf" title="Обновить">⟳</button></div>
  <div class="search">
    <input id="q" inputmode="search" placeholder="Номер: 23, RU 23, EN 7" autocomplete="off">
    <div class="lang"><button data-l="" class="on">Все</button><button data-l="RU">RU</button><button data-l="EN">EN</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tabs sub" id="stabs"></div>
</header>
<div class="ptr" id="ptr">Отпусти, чтобы обновить</div>
<main id="list"><div class="lock" id="lock">Загружаю…</div></main>

<div class="sheet" id="sheet">
  <div class="bar"><button class="back" id="back">‹ Список</button><span class="t" id="dt"></span>
    <button class="nav" id="prev">↑</button><button class="nav" id="next">↓</button></div>
  <div class="wrap" id="detail"></div>
</div>
<div class="toast" id="toast"></div>
<button class="up" id="up">↑</button>

<script>
// 19.10: a broken script left the app on «Загружаю…» forever. This tiny block runs first and on its own: any error or a
// list still empty after 25 s shows what happened and a reload button instead of an endless spinner.
(function () {
  function show(msg) {
    var l = document.getElementById("lock");
    if (!l || !document.body.contains(l)) return;
    l.innerHTML = "Приложение не загрузилось: " + String(msg).replace(/[<>&]/g, "") +
      '<br><br><button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;font-weight:700">Обновить</button>';
  }
  window.addEventListener("error", function (e) { show(e.message || "ошибка"); });
  window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || "ошибка сети"); });
  setTimeout(function () { var l = document.getElementById("lock"); if (l && /Загружаю/.test(l.textContent)) show("долго нет ответа (сеть?)"); }, 25000);
})();
</script>
<script>
const APP_VER = "2026-10-24-e";  // bump on every change: an old copy cached by Telegram reloads itself
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.platform && Telegram.WebApp.platform !== "unknown" ? Telegram.WebApp : null;
// keyboard button launch: no initData, sendData works; inline / menu launch: initData set, sendData doesn't
const KB = TG && !TG.initData;
if (TG) { TG.ready(); TG.expand(); try { TG.setHeaderColor("#0b0b0d"); TG.setBackgroundColor("#0b0b0d"); } catch (e) {} }
const qs = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.slice(1));
let K = qs.get("k") || hs.get("k");
try { if (K) localStorage.setItem("rk", K); else K = localStorage.getItem("rk"); } catch (e) {}
const TABS = [["scripts", "Сценарии"], ["status", "Статус"], ["you", "Ждут тебя"], ["work", "В работе"], ["failed", "Не прошли"], ["done", "⏳ Ждут публикации"], ["plan", "🗓 Запланированы"], ["out", "📢 Опубликовано"], ["cal", "📅 Календарь"], ["off", "🚫 Не выкладываем"], ["all", "Все"]];
const dm = (t) => t.slice(8, 10) + "." + t.slice(5, 7) + " " + t.slice(11, 16);
// 19.10: the planned and the real publishing time on every card and list row: «🗓 План 20.10 11:00 · 📢 Выложен 20.10 11:02»
const lbl = (x) => x.state === "done" && x.pend ? ((x.pubs || []).some((p) => p.st === "out") ? "🗓 Частично вышел" : "🗓 Запланирован") : x.state === "done" && x.out ? "📢 Опубликован" : x.state === "done" && x.when && ["Запланирован", "▶️ К выкладке"].includes(x.status) ? "🗓 Запланирован" : LABEL[x.state];
const okT = (t) => /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(t || "");
const pubChips = (x) => (okT(x.when) && (x.pend || !x.out) ? `<span class="chip">🗓 ${x.pend && (x.pubs || []).some((p) => p.st === "out") ? "Дальше" : "План"} ${dm(x.when)}</span>` : "") + (okT(x.out) ? `<span class="chip">📢 Выложен ${dm(x.out)}</span>` : "");

    ${(x.log || []).length ? `<details style="margin-top:8px"><summary class="hint">Что происходило (последние шаги)</summary><div class="pack" style="font-size:12px;color:var(--mute);margin-top:6px">${(x.log || []).map(esc).join("\n")}</div></details>` : ""}
    ${(x.acts || []).length ? `<div class="hint" style="margin-top:8px">Твои нажатия: ${(x.acts || []).map((a) => esc(a.t + " " + a.a)).join(" · ")}</div>` : ""}
    <div class="hint" style="margin-top:6px">${esc(x.tag)} · ${esc(x.pillar || "")} · обновлено ${esc(x.updated || "")}</div></div>`;
  h += `<div class="box"><h3>Что дальше</h3>${acts.length ? `<div class="acts" style="margin:0">${acts.map(([a, t, c]) => `<button class="btn ${c}" data-a="${a}">${t}</button>`).join("")}
      <div class="form" id="form"><textarea id="txt"></textarea><button class="btn main" id="send">Отправить</button></div></div>` : `<div class="hint" style="font-size:14px">${NEXT[x.state] || ""}</div>`}</div>`;
  if (x.speech) h += `<div class="box speech"><h3>🎙 Криво в речи</h3><div class="pack">${esc(x.speech)}</div></div>`;
  h += blockHtml(x);
  if (x.trial !== undefined && (x.trial || x.trial_hook)) h += `<div class="box"><h3>🧪 Пробная версия (только Instagram)</h3><div class="hint" style="font-size:14px">Хук: ${esc(x.trial_hook || "")}<br>Другие картинки и кадр 0. Выйдет пробным роликом, основная лента её не видит.</div>${x.trial ? `<button class="btn" id="trialbtn" style="margin-top:8px">▶️ Смотреть пробную</button> <button class="btn" id="mainbtn" style="margin-top:8px">▶️ Основная</button>` : `<div class="hint">Видео ещё делается</div>`}</div>`;
  if (x.hookdir) h += hookHtml(x.hookdir);
  if (x.audio && (x.state === "review" || x.state === "script")) h += karaokeHtml(x);
  if (x.state === "review") {
    h += `<div class="box"><h3>Хук</h3><div class="pack" style="font-size:17px;font-weight:700">${esc(x.hook)}</div>
      <div class="hint" style="margin-top:6px">${esc(x.format || "")} · ${esc(x.sec || "")} сек · оценка ${esc(x.score || "")}</div></div>`;
    h += `<div class="box"><h3>Сценарий</h3><div class="pack">${esc(x.script)}</div></div>`;
    if (x.ru) h += `<details class="box"><summary><h3 style="display:inline">Перевод</h3></summary><div class="pack" style="margin-top:8px">${esc(x.ru)}</div></details>`;
    if (x.screen) h += `<details class="box"><summary><h3 style="display:inline">На экран</h3></summary><div class="pack" style="margin-top:8px">${esc(x.screen)}</div></details>`;
    if (x.why) h += `<details class="box"><summary><h3 style="display:inline">Почему сильный</h3></summary><div class="pack" style="margin-top:8px">${esc(x.why)}</div></details>`;
    if (x.agents) h += `<details class="box"><summary><h3 style="display:inline">Выводы агентов</h3></summary><div class="pack" style="margin-top:8px">${esc(x.agents)}</div></details>`;
    if (x.sources) h += `<details class="box"><summary><h3 style="display:inline">Источники</h3></summary><div class="pack" style="margin-top:8px">${esc(x.sources)}</div></details>`;
    if (x.edit) h += `<div class="box"><h3>Твоя правка</h3><div class="pack">${esc(x.edit)}</div></div>`;
    return h;
  }
  for (const s of x.sections || []) {
    h += `<details class="box"><summary><h3 style="display:inline">${esc(s.t)}</h3></summary><div style="margin-top:10px">`;
    if (s.note) h += `<div class="hint" style="font-size:14px;color:#5fdb7f;margin-bottom:8px">${esc(s.note)}</div>`;
    if (s.text) h += `<div class="pack">${esc(s.text)}</div>`;
    for (const bl of s.blocks || []) h += `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b style="font-size:13px;color:var(--mute)">${esc(bl.k)}</b>
      <button class="more" data-copy="${encodeURIComponent(bl.text)}" style="padding:0">Копировать</button></div><div class="pack">${esc(bl.text)}</div>${bl.ru ? `<div class="pack" style="font-size:13px;color:var(--mute);margin-top:4px">🇷🇺 ${esc(bl.ru)}</div>` : ""}</div>`;
    // reviewers' scores the Telegram way: «👁 Визуал 7/10 · …», one per paragraph
    for (const r of s.rows || []) h += `<div style="margin:0 0 12px"><div class="row" style="gap:8px"><b style="font-size:14px">${esc(r.k)}</b>${sc(r.score)}</div>
      <div class="pack" style="font-size:13.5px;color:#c9c9d1;margin-top:4px;line-height:1.5">${esc(r.text)}</div></div>`;
    if (s.head) h += `<div style="font-size:14px;font-weight:700;margin:2px 0 10px">${esc(s.head)}</div>`;
    // 18.10, Alex: tick the notes that matter, «Поправить выбранные» sends only those (fs), the rest stays as is
    const pick = /^Мелочи ролика/.test(s.t) && x.state !== "work" && x.state !== "queue";
    if ((s.bullets || []).length) h += s.bullets.map((l) => { const m = /^\[(\d+)\/10\]\s*(.*)$/s.exec(l) || [null, "", l];
      const v = +m[1]; const col = v >= 8 ? "#ff7a71" : v >= 6 ? "var(--accent)" : "var(--mute)";
      return `<label class="row" style="align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:nowrap">
        ${pick ? `<input type="checkbox" class="selnote" data-t="${encodeURIComponent(l)}" style="width:20px;height:20px;flex:none;margin-top:1px">` : ""}
        <span class="sc" style="color:${col};flex:none">${v ? v + "/10" : "•"}</span><div class="pack" style="font-size:14px;line-height:1.45">${esc(m[2])}</div></label>`; }).join("")
      + (pick ? `<button class="btn" id="fsel" style="width:100%;margin:4px 0 8px">🔧 Поправить выбранные</button>` : "");
    else if ((s.details || []).length) h += `<div class="hint" style="margin-bottom:8px">Короткий список готовится, пока подробно:</div>`;
    if ((s.details || []).length) h += `<details style="margin-top:6px"><summary class="hint" style="font-size:13px">Подробнее от ревьюеров (${s.details.length})</summary>
      ${s.details.map((l) => `<div class="pack" style="font-size:13px;line-height:1.5;margin:10px 0;padding-left:10px;border-left:2px solid var(--line)">${esc(l).replace(/\n→ /g, "<br><b>→ Как исправить:</b> ")}</div>`).join("")}</details>`;
    if ((s.list || []).length) h += `<div style="margin-top:8px">${s.list.map((l) => { const [ru] = l.split("\n(EN) ");
      return `<div class="pack" style="font-size:13px;margin-bottom:10px">• ${esc(ru)}</div>`; }).join("")}</div>`;
    h += `</div></details>`;
  }
  h += `<details class="box"><summary><h3 style="display:inline">Сценарий</h3></summary><div class="pack" style="margin-top:8px">${esc(x.script)}</div></details>`;
  return h;
}

// ---- script audio, karaoke (Alex 17.10: tap a word, the audio starts there, the word being said lights up) ----
let AUD = null, AUD_ID = null, KMAP = [];
const kn = (t) => t.toLowerCase().replace(/ё/g, "е").replace(/[^\p{L}\p{N}]/gu, "");
function karaokeHtml(x) {
  const marks = x.marks || [];
  let j = 0; KMAP = [];
  const toks = x.script.split(/(\s+)/);
  const html = toks.map((t) => {
    if (!t.trim()) return t.includes("\n") ? "<br>".repeat(Math.min(2, (t.match(/\n/g) || []).length)) : " ";
    const n = kn(t);
    let hit = -1;
    for (let q = j; q < Math.min(marks.length, j + 4); q++) { if (kn(marks[q][0]) === n || (n && kn(marks[q][0]).startsWith(n.slice(0, 3)))) { hit = q; break; } }
    if (hit >= 0) j = hit + 1;
    const mi = hit >= 0 ? hit : Math.max(0, j - 1);
    KMAP.push(mi);
    return `<span class="kw" data-k="${KMAP.length - 1}">${esc(t)}</span>`;
  }).join("");
  return `<div class="box"><h3>🎧 Озвучка: тапни слово, начнёт с него</h3>
    <div class="row" style="margin-bottom:10px"><button class="btn main" id="kplay" style="padding:10px 18px">▶︎ Слушать</button>
    <button class="btn" id="kslow" style="padding:10px 14px">1×</button></div>
    <div class="pack" id="kar" style="font-size:17px;line-height:1.6">${html}</div></div>`;
}
async function bindKaraoke(x) {
  const box = $("#kar"); if (!box || !x.audio) return;
  const marks = x.marks || [];
  const ensure = async () => {
    if (AUD && AUD_ID === x.id) return AUD;
    if (AUD) { AUD.pause(); AUD = null; }
    $("#kplay").textContent = "Загружаю…";
    const b = await open(await getVideo("../a/" + x.audio).catch(() => fetchVideo("../a/" + x.audio)));
    if (AUD && AUD.src) URL.revokeObjectURL(AUD.src);
    AUD = new Audio(URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }))); AUD_ID = x.id;
    AUD.onended = () => { $("#kplay") && ($("#kplay").textContent = "▶︎ Слушать"); };
    return AUD;
  };
  const spans = [...box.querySelectorAll(".kw")];
  const tick = () => {
    if (!AUD || AUD_ID !== x.id || !document.body.contains(box)) return;
    const t = AUD.currentTime; let mi = -1;
    for (let q = 0; q < marks.length; q++) { if (marks[q][1] <= t + 0.05) mi = q; else break; }
    spans.forEach((sp) => sp.classList.toggle("on", KMAP[+sp.dataset.k] === mi && mi >= 0));
    const on = box.querySelector(".kw.on"); if (on && !AUD.paused) { const r = on.getBoundingClientRect(); if (r.top < 120 || r.bottom > innerHeight - 80) on.scrollIntoView({ block: "center", behavior: "smooth" }); }
    if (!AUD.paused) requestAnimationFrame(tick);
  };
  $("#kplay").onclick = async () => { const a = await ensure(); if (a.paused) { a.play(); $("#kplay").textContent = "⏸ Пауза"; tick(); } else { a.pause(); $("#kplay").textContent = "▶︎ Слушать"; } };
  $("#kslow").onclick = async () => { const a = await ensure(); a.playbackRate = a.playbackRate === 1 ? 0.8 : 1; $("#kslow").textContent = a.playbackRate === 1 ? "1×" : "0.8×"; };
  spans.forEach((sp) => sp.onclick = async () => { const a = await ensure(); const m = marks[KMAP[+sp.dataset.k]]; if (m) a.currentTime = Math.max(0, m[1] - 0.05);
    a.play(); $("#kplay").textContent = "⏸ Пауза"; tick(); });
}

function bindInfo(x) {
  bindKaraoke(x);
  const tb = document.getElementById("trialbtn"), mb = document.getElementById("mainbtn");
  if (tb) tb.onclick = () => { video(Object.assign({}, x, { video: x.trial })); window.scrollTo({ top: 0, behavior: "smooth" }); };
  if (mb) mb.onclick = () => { video(x); window.scrollTo({ top: 0, behavior: "smooth" }); };
  let pending = null;
  document.querySelectorAll("[data-a]").forEach((el) => el.onclick = () => {
    const a = el.dataset.a;
    if (TEXT_ACTS.includes(a)) {
      pending = a; $("#form").classList.add("on");
      $("#txt").placeholder = a === "pt" ? "Когда: «18.10 19:30» или «завтра 21:00» (Алматы)" : a === "ed" ? "Что поправить в сценарии. Можно надиктовать 🎙" : "Что переделать. Можно надиктовать с клавиатуры 🎙";
      $("#txt").rows = a === "pt" ? 1 : 5; $("#txt").focus(); return;
    }
    if (CONFIRM[a] && !confirm(CONFIRM[a])) return;
    if (a === "ap" && document.querySelector(".hookpick")) {
      const picked = [...document.querySelectorAll(".hookpick:checked")].map((c) => decodeURIComponent(c.dataset.h));
      if (picked.length !== 2) { toast("Отметь ровно 2 хука"); return; }
      send(a, x.id, JSON.stringify({ hooks: picked })); return;
    }
    send(a, x.id, "");
  });
  $("#send") && ($("#send").onclick = () => {
    const t = $("#txt").value.trim();
    if (!t) { toast("Напиши текст"); return; }
    send(pending, x.id, t);
  });
  document.querySelectorAll("[data-copy]").forEach((el) => el.onclick = () => {
    try { navigator.clipboard.writeText(decodeURIComponent(el.dataset.copy)); toast("Скопировано"); } catch (e) {}
  });
}

let infoSig = "";
function fillDetail(x, withVideo = true) {
  $("#dt").textContent = `${nm(x)} · батч ${day(x)}`;
  const busy = ($("#form") && ($("#form").classList.contains("on") || ($("#txt") && $("#txt").value))) || (AUD && !AUD.paused);
  const sigNow = JSON.stringify(x);
  if (!withVideo && (busy || sigNow === infoSig)) return;  // a refresh never wipes what he is typing, never touches the player
  infoSig = sigNow;
  if (withVideo) {
    stopPlayer();
    const i = shown.findIndex((y) => y.id === x.id);
    setTimeout(() => (pre[x.video] || Promise.resolve()).then(() => [shown[i + 1], shown[i - 1]].forEach((y) => y && preload(y))), 0);
    $("#detail").innerHTML = (x.state === "review" ? "" : `<div class="player" id="player"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="more" id="fs" style="padding:0">⛶ На весь экран</button></div>`) + `<div id="info"></div>`;
    if (x.state !== "review") video(x);
    // 18.10, Alex: «не работает кнопка на весь экран». Native fullscreen is refused inside Telegram / before metadata, and a
    // fixed player inside the card sheet stays clipped by it. The video element moves into its own layer on <body>
    // (all screen, black, ✕ to close, the same playback continues), then back into the card.
    $("#fs") && ($("#fs").onclick = () => {
      const v = $("#player video");
      if (!v) { toast("Видео ещё грузится, нажми через пару секунд"); return; }
      const lay = document.createElement("div");
      lay.id = "bigv";
      lay.innerHTML = '<button class="bigx">✕</button>';
      document.body.appendChild(lay);
      lay.insertBefore(v, lay.firstChild);
      try { if (window.Telegram && Telegram.WebApp) Telegram.WebApp.expand(); } catch (e) {}
      v.play().catch(() => {});
      lay.querySelector(".bigx").onclick = () => { const pl = $("#player"); if (pl) pl.appendChild(v); else v.pause(); lay.remove(); };
    });
  }
  $("#info").innerHTML = infoHtml(x);
  bindInfo(x);
}

async function seal(obj) {
  const k = await crypto.subtle.importKey("raw", b64(K), "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return btoa(String.fromCharCode(...all)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
let PEND = {};
try { PEND = JSON.parse(localStorage.getItem("pend") || "{}"); } catch (e) {}
const savePend = () => { try { localStorage.setItem("pend", JSON.stringify(PEND)); } catch (e) {} };
document.addEventListener("click", (e) => {  // «Поправить выбранные»: only the ticked notes go to the rework
  if (!e.target || e.target.id !== "fsel" || !cur) return;
  const t = [...document.querySelectorAll(".selnote:checked")].map((c) => "- " + decodeURIComponent(c.dataset.t)).join("\n");
  if (!t) { toast("Отметь галочками, что править"); return; }
  send("fs", cur, t);
});
async function sendInApp(a, id, text) {  // an encrypted GitHub issue in the Pages repo; the Mac picks it up in ~10 s
  const r = await fetch("https://api.github.com/repos/chagagagaga/prompter/issues", { method: "POST",
    headers: { Authorization: "Bearer " + GHT, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ title: "app-action", body: await seal({ a, id, text, t: Date.now() }) }) });
  if (!r.ok) throw new Error(r.status);
}
function send(a, id, text) {
  const notes = { r4: "🎬 4К поехал", notes: "✏️ Замечания ушли", fr: "🔧 Правлю мелочи", ft: "🔧 Правлю мелочи", fb: "🔧 Правлю мелочи",
    pp: "✅ Ставлю на выкладку", pt: "🕒 Ставлю на время", pe: "✏️ Снимаю и переделываю", pc: "🚫 В «Не выкладываем»", fx: "🔧 Дорабатываю",
    ap: "✅ Беру", ed: "✏️ Правлю сценарий", rw: "❌ Переписываю", tr: "🗑 В мусор", fs: "🔧 Правлю отмеченные", un: "↩️ Возвращаю" };
  if (GHT) {
    const x = DATA.items.find((i) => i.id === id);
    sendInApp(a, id, text).then(() => {
      PEND[id] = { a: notes[a], c: a, sig: x ? sig(x) : "", t: Date.now() }; savePend(); toast(notes[a] + ": принято");
      if ($("#form")) { $("#form").classList.remove("on"); if ($("#txt")) $("#txt").value = ""; }
      infoSig = ""; if (cur === id && x) fillDetail(x, false); render(); setTimeout(load, 12000);
    }).catch(() => toast("Не отправилось, проверь интернет и нажми ещё раз"));
    return;
  }
  if (KB) {  // launched from the bot's keyboard button: the command goes straight to the bot, text included
    try { TG.sendData(JSON.stringify({ a, id, text })); return; } catch (e) {}
  }
  // Safari / home screen: a command link opens the bot; a text is copied, the bot asks for it
  if (text) { try { navigator.clipboard.writeText(text); } catch (e) {} }
  const link = `https://t.me/${DATA.bot}?start=${a}_${id}`;
  toast(notes[a] + (text ? ": текст скопирован, вставь его в чат с ботом" : ""));
  setTimeout(load, 30000);
  setTimeout(() => { if (TG) { TG.openTelegramLink(link); } else location.href = link; }, text ? 900 : 300);
}

function openReel(id) {
  const x = DATA.items.find((i) => i.id === id); if (!x) return;
  SEEN[id] = sig(x); saveSeen(); infoSig = "";
  cur = id; $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0; document.body.style.overflow = "hidden";
  fillDetail(x);
}
function closeReel() {
  stopPlayer();
  cur = null; $("#sheet").classList.remove("on"); document.body.style.overflow = ""; $("#detail").innerHTML = ""; $("#up").classList.remove("on");
  if (DATA) render();
}
function step(d) {
  const i = shown.findIndex((x) => x.id === cur); const n = shown[i + d]; if (n) { cur = n.id; SEEN[n.id] = sig(n); saveSeen(); infoSig = ""; $("#sheet").scrollTop = 0; fillDetail(n); }
}
$("#list").onclick = (e) => {
  if (tab === "cal" && !$("#q").value.trim() && calClick(e)) return;
  const it = e.target.closest(".item"); if (it) openReel(it.dataset.id);
};
try { tab = localStorage.getItem("tab") || "you"; } catch (e) {}
try { sub = localStorage.getItem("sub") || "you"; } catch (e) {}
$("#stabs").onclick = (e) => { const t = e.target.closest(".tab"); if (t) { sub = t.dataset.s; try { localStorage.setItem("sub", sub); } catch (e) {} render(); window.scrollTo(0, 0); } };
$("#tabs").onclick = (e) => { const t = e.target.closest(".tab"); if (t) { tab = t.dataset.t; try { localStorage.setItem("tab", tab); } catch (e) {} render(); window.scrollTo(0, 0); } };
document.querySelectorAll(".lang button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".lang button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); lang = b.dataset.l; render(); });
$("#q").oninput = render;
window.addEventListener("scroll", () => $("#up").classList.toggle("on", window.scrollY > 600), { passive: true });
$("#sheet").addEventListener("scroll", () => $("#up").classList.toggle("on", $("#sheet").scrollTop > 600), { passive: true });
$("#up").onclick = () => { if (cur) $("#sheet").scrollTo({ top: 0, behavior: "smooth" }); else window.scrollTo({ top: 0, behavior: "smooth" }); };
$("#back").onclick = () => closeReel();
$("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
if (TG) { TG.BackButton.onClick(() => closeReel()); }
setInterval(() => { if (TG) cur ? TG.BackButton.show() : TG.BackButton.hide(); }, 400);
try {  // instant start: the last data saved on the phone, the fresh one follows in a second or two
  const c = localStorage.getItem("dcache");
  if (c && K) { DATA = JSON.parse(c); GHT = DATA.gh || ""; $("#upd").innerHTML = "⏳ загружаю, в кэше от " + DATA.updated + " (Алматы)"; render(); }
} catch (e) {}
load().then(() => { if (DATA) setTimeout(prefetchAll, 300); const id = qs.get("r") || location.hash.slice(1); if (/^\d{6}-(RU|US)-\d\d$/.test(id)) openReel(id); });
document.addEventListener("click", (e) => { const s = e.target.closest("summary"); if (s) e.stopPropagation(); });
setInterval(() => { if (!document.hidden) load(); }, 10000);
$("#rf").onclick = async () => { $("#rf").textContent = "…"; try { await load(); toast("Обновлено"); } finally { $("#rf").textContent = "⟳"; } };
let y0 = null;
document.addEventListener("touchstart", (e) => { y0 = window.scrollY <= 0 && !cur ? e.touches[0].clientY : null; }, { passive: true });
document.addEventListener("touchmove", (e) => { if (y0 === null) return; const d = e.touches[0].clientY - y0;
  $("#ptr").style.height = d > 20 ? Math.min(50, d / 2) + "px" : "0"; $("#ptr").textContent = d > 90 ? "Отпусти, чтобы обновить" : "Потяни ещё"; }, { passive: true });
document.addEventListener("touchend", async (e) => { if (y0 === null) return; const d = e.changedTouches[0].clientY - y0; y0 = null;
  if (d > 90) { $("#ptr").textContent = "Обновляю…"; await load(); toast("Обновлено"); } $("#ptr").style.height = "0"; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); else if (PLAYER) PLAYER.pause(); });
</script>
