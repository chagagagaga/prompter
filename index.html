<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<title>Суфлёр</title>
<style>
:root { --bg:#fff; --fg:#000; --dim:#6b6b70; --acc:#ffd23f; --ok:#22b863; --line:rgba(200,150,0,.45); --card:#f1f1f4; --btn:#e6e6eb; }  /* light theme (Alex 16.10) */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, system-ui, sans-serif; height:100%; overflow:hidden; }
button { font:inherit; color:inherit; background:var(--btn); border:0; border-radius:12px; padding:10px 14px; }
button.on { background:var(--acc); color:#000; }
#list { position:absolute; inset:0; overflow-y:auto; padding:calc(env(safe-area-inset-top) + 12px) max(16px, calc(env(safe-area-inset-right) + 8px)) 40px max(16px, calc(env(safe-area-inset-left) + 8px)); }
#list h1 { font-size:20px; margin:4px 0 2px; }
#meta { color:var(--dim); font-size:13px; margin-bottom:12px; }
.tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.tabs button { padding:6px 10px; font-size:14px; border-radius:10px; }
.item { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
.item .t { color:var(--dim); font-size:13px; }
.item .h { font-size:16px; margin-top:4px; line-height:1.3; }
.item { display:flex; align-items:center; gap:12px; }
.item .body { flex:1; min-width:0; }
.item .chk { flex:none; width:44px; height:44px; border-radius:22px; border:2px solid #b8b8bf; background:transparent; padding:0;
  font-size:22px; color:transparent; display:flex; align-items:center; justify-content:center; }
#list.m > * { transform:scaleX(-1); }  /* the menu reads through the TP2 glass too (Alex 16.10) */
.item.sel { outline:3px solid var(--acc); outline-offset:2px; }
.item.done { background:rgba(34,184,99,.14); box-shadow:inset 0 0 0 1.5px var(--ok); }
.item.done .chk { background:var(--ok); border-color:var(--ok); color:#fff; }
.item.done .t::after { content:"  ✓ записал"; color:var(--ok); }
.batch { display:flex; justify-content:space-between; align-items:baseline; margin:18px 2px 8px; font-size:17px; font-weight:700; }
.batch span { color:var(--dim); font-size:13px; font-weight:400; }
.batch.all-done span { color:var(--ok); }
#b-check.on { background:var(--ok); color:#000; }
#msg { color:var(--dim); padding:30px 0; line-height:1.5; }
#stage { position:absolute; inset:0; display:none; }
#viewport { position:absolute; inset:0; overflow:hidden; }
#roll { position:absolute; left:0; right:0; top:0; padding:0 max(7%, calc(env(safe-area-inset-right) + 12px)) 0 max(7%, calc(env(safe-area-inset-left) + 12px)); will-change:transform; }
#roll .tag { color:var(--dim); font-size:.45em; margin-bottom:.6em; }
#roll .txt { white-space:pre-wrap; line-height:1.38; font-weight:600; }
#roll .end { color:var(--dim); font-size:.5em; padding:1em 0 60vh; }
.mirror #roll { transform-origin:center; }
#marker { position:absolute; left:0; right:0; height:0; border-top:2px solid var(--line); pointer-events:none; }
#count { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:30vw; font-weight:700; color:var(--acc); pointer-events:none; }
#bar { position:absolute; left:0; right:0; bottom:0; padding:10px max(6px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 10px) max(6px, env(safe-area-inset-left)); background:linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.94) 30%); display:flex; flex-wrap:nowrap; gap:4px; justify-content:center; }
#bar button { flex:1 1 0; min-width:0; padding:12px 0; font-size:17px; border-radius:10px; white-space:nowrap; }
#back { position:absolute; top:calc(env(safe-area-inset-top) + 10px); left:max(12px, calc(env(safe-area-inset-left) + 6px)); z-index:4; background:rgba(230,230,235,.9); font-weight:600; }
.playing #back { opacity:.25; }
#bar .big { background:var(--acc); color:#000; font-weight:700; flex:1.6 1 0; }
.playing #bar { display:none; }
#hud { position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:50%; transform:translateX(-50%); background:rgba(30,30,32,.9); color:#fff; padding:8px 14px; border-radius:10px; font-size:15px; display:none; z-index:12; white-space:nowrap; }
/* 28.11 🤳 Фронталка: the page records the front camera itself, the text runs at the top, right under the lens */
#modes button { flex:1 1 0; padding:10px 8px; font-size:15px; line-height:1.25; }
#frecover .r { background:#3a1d00; border:1px solid #ff9f0a; border-radius:12px; padding:10px 12px; margin:8px 0; font-size:15px; line-height:1.35; }
#frecover .r div { display:flex; gap:8px; margin-top:8px; }
#frecover .r button { flex:1; padding:10px 6px; font-size:15px; background:rgba(255,255,255,.16); color:#fff; }
#frecover .r button.s { background:var(--acc); color:#000; font-weight:700; }
a.dl { display:block; margin-top:8px; padding:14px 10px; border-radius:12px; background:var(--acc); color:#000; font-weight:800; font-size:17px; text-align:center; text-decoration:none; }
.dlhint { font-size:13px; opacity:.8; margin-top:6px; line-height:1.35; }
#modes button small { display:block; font-size:12px; opacity:.75; }
#cam { position:fixed; inset:0; background:#000; display:none; z-index:7; overflow:hidden; color:#fff; touch-action:manipulation; }
#cv { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
#fband { position:absolute; left:0; right:0; top:0; overflow:hidden; touch-action:none; background:rgba(0,0,0,.52);
  -webkit-mask-image:linear-gradient(transparent 0, #000 9%, #000 84%, transparent 100%); mask-image:linear-gradient(transparent 0, #000 9%, #000 84%, transparent 100%); }
#froll { position:absolute; left:0; right:0; top:0; padding:0 7%; will-change:transform; }
#froll .tag { color:rgba(255,255,255,.6); font-size:.45em; margin-bottom:.5em; }
#froll .txt { white-space:pre-wrap; line-height:1.32; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.85); }
#froll .end { color:rgba(255,255,255,.55); font-size:.5em; padding:1em 0 60vh; }
#fmark { position:absolute; left:2px; width:0; height:0; border-top:9px solid transparent; border-bottom:9px solid transparent; border-left:12px solid var(--acc); pointer-events:none; }
#fmic { position:absolute; right:12px; bottom:calc(env(safe-area-inset-bottom) + 104px); width:12px; height:70px; background:rgba(0,0,0,.5); border-radius:6px; overflow:hidden; }
#fmic i { position:absolute; left:0; right:0; bottom:0; height:0; background:#34c759; transition:height .08s linear; }
#fmic.off { background:#ff3b30; }
#frec { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 104px); background:rgba(255,59,48,.92); color:#fff; padding:6px 14px; border-radius:20px; font-weight:700; font-size:17px; display:none; font-variant-numeric:tabular-nums; }
.frecording #frec { display:block; }
#fres { position:absolute; left:12px; bottom:calc(env(safe-area-inset-bottom) + 104px); background:rgba(0,0,0,.5); padding:4px 10px; border-radius:10px; font-size:13px; }
.frecording #fres { display:none; }
#fbar { position:absolute; left:0; right:0; bottom:0; padding:12px max(8px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(8px, env(safe-area-inset-left));
  display:flex; gap:6px; align-items:center; justify-content:center; background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6)); }
#fbar button { background:rgba(255,255,255,.2); color:#fff; padding:11px 0; flex:1 1 0; min-width:0; font-size:16px; border-radius:10px; white-space:nowrap; }
#fbar #f-rec { flex:none; width:76px; height:76px; border-radius:38px; background:#ff3b30; border:4px solid #fff; font-size:26px; padding:0; }
.frecording #fbar button:not(#f-rec) { visibility:hidden; }
#fbar #f-pause { display:none; flex:none; width:62px; height:62px; border-radius:31px; background:rgba(255,255,255,.22); border:3px solid #fff; font-size:22px; padding:0; }
.frecording #fbar button#f-pause { display:block; visibility:visible; }
.fpaused #fbar button#f-slow, .fpaused #fbar button#f-fast, .fpaused #fbar button#f-small, .fpaused #fbar button#f-big { visibility:visible; }
.fpaused #frec { background:rgba(100,100,108,.94); }
.frecording #fbar { background:none; }
#fmsg { position:absolute; left:8%; right:8%; top:42%; transform:translateY(-50%); text-align:center; font-size:17px; line-height:1.45; display:none; background:rgba(0,0,0,.7); padding:18px; border-radius:14px; }
#fmsg button { margin-top:12px; background:var(--acc); color:#000; font-weight:700; }
#fdone { position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:3; }
#fpv { flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
#fdone .top { padding:calc(env(safe-area-inset-top) + 8px) max(10px, env(safe-area-inset-left)) 6px; }
#fdone .top button { background:rgba(255,255,255,.18); color:#fff; padding:10px 16px; font-size:16px; }
#fdone .info { text-align:center; font-size:13px; color:rgba(255,255,255,.7); padding:8px 12px 0; }
#fdone .row { display:flex; gap:8px; padding:10px max(10px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(10px, env(safe-area-inset-left)); }
#fdone .row button { flex:1; padding:14px 6px; font-size:16px; background:rgba(255,255,255,.18); color:#fff; }
#fdone .row .save { background:var(--acc); color:#000; font-weight:700; flex:1.4; }
#keytest { position:absolute; inset:0; background:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:16px; z-index:6; }
#keytest .k { font-size:34px; color:var(--acc); min-height:44px; }
#keytest .log { color:var(--dim); font-size:14px; max-height:40vh; overflow:auto; }
</style>
</head>
<body>
<div id="list">
  <h1>Суфлёр</h1>
  <div id="meta"></div>
  <div class="tabs" id="modes">
    <button data-m="tp">🪞 Телесуфлёр<small>телефон в суфлёре, задняя камера</small></button>
    <button data-m="front">🤳 Фронталка<small>текст на экране, запись здесь</small></button>
  </div>
  <div id="frecover"></div>
  <div class="tabs">
    <button data-f="all">Все</button><button data-f="ru">РУ</button><button data-f="en">США</button>
    <button id="reload">↻</button>
  </div>
  <div class="tabs" id="days"></div>
  <div id="items"></div>
  <div id="msg"></div>
</div>

<div id="stage">
  <button id="back">← Назад</button>
  <div id="viewport"><div id="roll"></div><div id="marker"></div></div>
  <div id="count"></div>
  <div id="bar">
    <button id="b-list">←</button>
    <button id="b-top">⟲</button>
    <button id="b-play" class="big">▶</button>
    <button id="b-check">✓</button>
    <button id="b-done">✓→</button>
    <button id="b-slow">🐢</button><button id="b-fast">🐇</button>
    <button id="b-small">A−</button><button id="b-big">A+</button>
    <button id="b-mirror">⇋</button>
    <button id="b-copy">📋</button>
  </div>
</div>
<div id="cam">
  <video id="cv" playsinline muted autoplay></video>
  <div id="fband"><div id="froll"></div><div id="fmark"></div></div>
  <div id="fmic"><i></i></div>
  <div id="fmsg"><div class="t"></div><button id="f-retry">↻ Включить камеру</button></div>
  <div id="fres"></div>
  <div id="frec">● 0:00</div>
  <div id="fbar">
    <button id="f-back">←</button><button id="f-slow">🐢</button><button id="f-fast">🐇</button>
    <button id="f-pause">⏸</button><button id="f-rec">⏺</button>
    <button id="f-small">A−</button><button id="f-big">A+</button><button id="f-band">▭</button><button id="f-q">4K</button>
  </div>
  <div id="fdone"><div class="top"><button id="f-list">← К сценариям</button></div><video id="fpv" playsinline controls></video><div class="info"></div>
    <div class="row"><button class="again" id="f-again">↻ Переснять</button><button class="save" id="f-save">💾 Сохранить</button><button id="f-next">✓ Дальше</button></div></div>
</div>
<div id="hud"></div>
<div id="keytest"><div>Нажимай кнопки на пульте по очереди.<br>Если ничего не появляется, пульт шлёт «громкость», и Safari его не видит.</div>
  <div class="k">…</div><div class="log"></div><button id="kt-close">Готово</button></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const VERSION = "28.11-front4";
// always the newest page (Alex 16.10: the iPhone kept an old copy): compare with the published file, reload if it differs
fetch("index.html?t=" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => {
  const m = t.match(/const VERSION = "([^"]+)"/);
  if (m && m[1] !== VERSION && !sessionStorage.getItem("tp_upd_" + m[1])) {
    sessionStorage.setItem("tp_upd_" + m[1], "1");
    location.replace(location.pathname + "?v=" + Date.now() + location.hash);
  }
}).catch(() => {});
const store = {
  get(k, d) { try { const v = localStorage.getItem("tp_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tp_" + k, JSON.stringify(v)); } catch (e) {} },
};
let S = { font: store.get("font", 44), speed: store.get("speed", 55), mirror: store.get("mirror", true), filter: store.get("filter", "all"), day: store.get("day", "all") };
let done = new Set(store.get("done", []));
let undone = new Set(store.get("undone", []));  // «Записан» in the sheet = recorded, unless he unticked it here
let items = [], cur = -1, playing = false, pos = 0, last = 0, raf = 0, lock = null;

const key = new URLSearchParams(location.hash.slice(1)).get("k");
if (key) store.set("key", key);
const K = key || store.get("key", null);

function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function load(force) {
  $("#msg").textContent = "Загружаю…";
  if (!K) { $("#msg").textContent = "Нет ключа. Открой ссылку на суфлёр из Telegram-бота."; return; }
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    const ck = await crypto.subtle.importKey("raw", b64(K), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(d.iv) }, ck, b64(d.ct));
    const data = JSON.parse(new TextDecoder().decode(pt));
    items = data.items;
    const ids = new Set(items.map(i => i.id));
    done = new Set([...done].filter(i => ids.has(i)));
    items.forEach(i => { if (i.status === "Записан" && !undone.has(i.id)) done.add(i.id); });
    store.set("done", [...done]);
    $("#meta").textContent = "Обновлено " + data.updated + " · сценариев " + items.length + " · версия " + VERSION;
    $("#msg").textContent = items.length ? "" : "Апрувнутых сценариев для записи нет.";
    renderList();
  } catch (e) {
    $("#msg").textContent = "Не получилось загрузить или расшифровать. Проверь интернет и что ссылка из бота целиком. (" + e.message + ")";
  }
}

function visible() {
  // 28.11 Alex: «порядок такой же, как в приложении» — the app's own sort (b.id.localeCompare(a.id): the newest batch first,
  // inside it the highest number first), so a script sits in the same place in both; recorded ones stay and turn green
  return items.filter(i => (S.filter === "all" || i.lang === S.filter) && (S.day === "all" || i.id.startsWith(S.day)))
    .slice().sort((a, b) => b.id.localeCompare(a.id));
}

function batchName(id) { return "Батч " + id.slice(4, 6) + "." + id.slice(2, 4); }

function setDone(id, on) {
  on ? (done.add(id), undone.delete(id)) : (done.delete(id), undone.add(id));
  store.set("done", [...done]); store.set("undone", [...undone]);
}

function renderDays() {
  // one chip per batch day, newest first (Alex 16.10: «фильтрация по дням батчей»)
  const days = [...new Set(items.map(i => i.id.slice(0, 6)))].sort().reverse();
  if (S.day !== "all" && !days.includes(S.day)) S.day = "all";
  const box = $("#days"); box.innerHTML = "";
  [["all", "Все дни"], ...days.map(d => [d, d.slice(4, 6) + "." + d.slice(2, 4)])].forEach(([d, label]) => {
    const b = document.createElement("button"); b.textContent = label; b.classList.toggle("on", S.day === d);
    b.onclick = () => { S.day = d; store.set("day", d); renderList(); };
    box.append(b);
  });
}

function renderList() {
  if (typeof tdbRecover === "function") tdbRecover();
  $("#list").classList.toggle("m", !!S.mirror && S.mode !== "front");
  $("#list").style.zoom = S.ui || 1;
  document.querySelectorAll("#modes [data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === S.mode));
  renderDays();
  document.querySelectorAll(".tabs [data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === S.filter));
  const box = $("#items"); box.innerHTML = "";
  const v = visible();
  let batch = null;
  v.forEach(it => {
    const b = it.id.slice(0, 6);
    if (b !== batch) {
      batch = b;
      const all = v.filter(x => x.id.startsWith(b)), n = all.filter(x => done.has(x.id)).length;
      const hd = document.createElement("div");
      hd.className = "batch" + (n === all.length ? " all-done" : "");
      hd.innerHTML = batchName(b) + " <span>записано " + n + " из " + all.length + "</span>";
      box.append(hd);
    }
    const el = document.createElement("div");
    const idx = v.indexOf(it);
    el.className = "item" + (done.has(it.id) ? " done" : "") + (idx === sel ? " sel" : "");
    if (idx === sel) setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 0);
    const body = document.createElement("div"); body.className = "body";
    const t = document.createElement("div"); t.className = "t";
    t.textContent = (it.lang === "en" ? "🇺🇸 " : "🇰🇿 ") + it.tag + " · " + it.pillar;
    const h = document.createElement("div"); h.className = "h"; h.textContent = it.text.split("\n")[0];
    body.append(t, h);
    const c = document.createElement("button"); c.className = "chk"; c.textContent = "✓"; c.setAttribute("aria-label", "записан");
    c.onclick = e => { e.stopPropagation(); setDone(it.id, !done.has(it.id)); renderList(); };
    el.append(body, c);
    body.onclick = () => open(items.indexOf(it));
    box.append(el);
  });
}

function hud(t) { const h = $("#hud"); h.textContent = t; h.style.display = "block"; clearTimeout(hud.t); hud.t = setTimeout(() => h.style.display = "none", 1400); }

function applyView() {
  const roll = $("#roll");
  roll.style.fontSize = S.font + "px";
  $("#b-mirror").classList.toggle("on", S.mirror);
  $("#marker").style.top = (innerHeight * 0.3) + "px";
  draw();
}
function draw() { $("#roll").style.transform = "translateY(" + (-pos + innerHeight * 0.3) + "px)" + (S.mirror ? " scaleX(-1)" : ""); }

function open(i) {
  if (S.mode === "front") return fopen(i);
  if (i < 0 || i >= items.length) return;
  stop(); cur = i; pos = 0;
  const it = items[i], roll = $("#roll");
  roll.innerHTML = "";
  const tg = document.createElement("div"); tg.className = "tag"; tg.textContent = it.tag + " · " + it.pillar;
  const tx = document.createElement("div"); tx.className = "txt"; tx.textContent = it.text;
  const en = document.createElement("div"); en.className = "end"; en.textContent = "· конец ·";
  roll.append(tg, tx, en);
  $("#b-check").classList.toggle("on", done.has(it.id));
  if ($("#stage").style.display !== "block") history.pushState({ stage: 1 }, "");  // iPhone swipe-back returns to the list
  $("#list").style.display = "none"; $("#stage").style.display = "block";
  applyView(); wake();
}
function toList() { stop(); $("#stage").style.display = "none"; $("#list").style.display = "block"; renderList(); }

function maxPos() { return Math.max(0, $("#roll").scrollHeight - innerHeight * 0.9); }
function tick(t) {
  if (!playing) return;
  if (last) pos = Math.min(maxPos(), pos + S.speed * (t - last) / 1000);
  last = t; draw();
  if (pos >= maxPos()) { stop(); return; }
  raf = requestAnimationFrame(tick);
}
let counting = false;
function start() {
  // no 3-2-1 countdown (Alex 16.10): the text moves the moment he presses start
  if (playing) return;
  playing = true; last = 0; document.body.classList.add("playing"); $("#b-play").textContent = "❚❚"; report();
  raf = requestAnimationFrame(tick);
}
function stop() { const was = playing; playing = false; cancelAnimationFrame(raf); document.body.classList.remove("playing"); $("#b-play").textContent = "▶"; if (was) report(); }
function toggle() { playing ? stop() : start(); }
function top() { stop(); pos = 0; draw(); hud("⟲ С начала"); }
function speed(d) { S.speed = Math.max(10, Math.min(250, S.speed + d)); store.set("speed", S.speed); hud("Скорость " + S.speed); }

// 28.11 Alex: «снял 161, нажал сохранить, и он просто пропал». A 4K take lived whole in Safari's memory (~400 MB a minute)

const TDB = { db: null, q: Promise.resolve(), id: 0, n: 0, ok: false, saved: 0 };

    const r = document.createElement("div"); r.className = "r";
    r.innerHTML = (t.saved ? "✓ Скачан дубль <b></b> · снят в " : "⚠️ Не сохранён дубль <b></b> · снят в ") + z(d.getHours()) + ":" + z(d.getMinutes()) + " · <span>…</span><div><button class=\"s\">💾 Сохранить</button><button class=\"d\">🗑 Удалить</button></div>";
    r.querySelector("b").textContent = t.tag || t.name;
    box.append(r);
    tdbChunks(t.id).then(a => { r.querySelector("span").textContent = fmtMB(a.reduce((x, b) => x + b.size, 0)); }).catch(() => {});

      if (ok) { await mark(); tdbRecover(); }

}
// 28.11 (2nd loss, Alex: «нажимаю «Сохранить», и у меня вылетает приложение»): Safari's «Поделиться» reads the whole file
// into memory, a 4K take of a minute+ (300-500 MB) kills the tab. A big take is never shared: a real link he taps downloads
// it from the phone's storage to «Файлы → Загрузки» (streamed, no memory spike); from Files: «Сохранить видео» / AirDrop.
const BIG = () => (window.__tpBig || 40e6);
function dlLink(blob, name, box, onTap) {
  box.querySelectorAll("a.dl, .dlhint").forEach(x => x.remove());
  const a = document.createElement("a"); a.className = "dl"; a.href = URL.createObjectURL(blob); a.download = name;
  a.textContent = "⬇️ Скачать в Файлы · " + fmtMB(blob.size);
  a.addEventListener("click", () => setTimeout(() => onTap && onTap(), 50));
  const h = document.createElement("div"); h.className = "dlhint";
  h.textContent = "Нажми ⬇️, потом «Загрузить». Видео ляжет в «Файлы → Загрузки»: открой его там → «Поделиться» → «Сохранить видео» (или AirDrop на Мак). Дубль остаётся и в памяти суфлёра.";
  box.append(a, h);
}
async function shareFile(file, url) {  // true = saved / shared; the page never navigates away (that lost the take too)
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); hud("✓ Готово. Проверь в Фото"); return true; }
  } catch (e) {
    if (e.name === "AbortError") return false;
    hud("«Поделиться» не открылось (" + e.name + "): сохраняю в Файлы. Дубль цел в памяти телефона");
  }
  const a = document.createElement("a"); a.href = url; a.download = file.name;
  document.body.append(a); a.click(); a.remove(); return true;
}
function fclock() {
  const ms = recAcc + (rec && rec.state === "recording" ? Date.now() - recT0 : 0), t = Math.floor(ms / 1000);
  // «💾 N с» = seconds already on the phone's disk (they survive a crash); «⚠️» = this browser holds the take in memory only
  const disk = TDB.ok && TDB.saved ? " · 💾 " + TDB.saved + " с" : (t >= 4 ? " · ⚠️ только в памяти" : "");
  $("#frec").textContent = (fpausedNow() ? "⏸ " : "● ") + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0") + (fpausedNow() ? " пауза" : "") + disk;
}
function frecToggle() {  // keyboard / remote / gamepad: start, stop; on pause it goes on (a stop from pause = the ⏹ button)
  if (fpausedNow()) { fpause(); return; }
  if (busyRec()) { frecStop(); return; }
  frecStart();
}
async function frecStart() {
  if (busyRec() || $("#fdone").style.display === "flex") return;
  if (!(await camStart())) return;

  fplay(false); fpos = 0; fdraw();
  const type = pickType(); chunks = [];
  try { rec = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: bitrate(), audioBitsPerSecond: 192000 }, type ? { mimeType: type } : {})); }
  catch (e) { try { rec = new MediaRecorder(stream); } catch (e2) { hud("Запись не запустилась: " + e2.message); return; } }
  const it = items[fcur], m = /([A-Z]{2}\d+_\d{4})/.exec(it ? it.tag : ""), d = new Date(), z = n => String(n).padStart(2, "0");
  const mt = rec.mimeType || type || "video/mp4";
  const name = (m ? m[1] : (it ? it.id : "take")) + "_front_" + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + "." + (/mp4/.test(mt) ? "mp4" : "webm");

function fpause(back) {  // ⏸ the recording and the text stop together; ▶︎ both go on, the file keeps everything before

  if (rec.state === "recording") {
    try { rec.pause(); } catch (e) { hud("Пауза здесь не работает: ⏹ закончит дубль"); return; }
    recAcc += Date.now() - recT0; fplay(false);
    if (back) fnudge(-90);
    document.body.classList.add("fpaused"); $("#f-pause").textContent = "▶︎";
    hud(back ? "⏸ Пауза, текст назад на 2 строки" : "⏸ Пауза: снятое не сбросится"); fclock();
  } else if (rec.state === "paused") {

async function fsaved() {

async function fsave() {

function fopen(i) {

function fnext() {

$("#fband").addEventListener("click", () => {

// the text stands (pause, before ⏺): drag it with a finger to the line to read from
$("#fband").addEventListener("pointerdown", e => { fdragged = false; if (fscroll) return; fdragY = e.clientY; fdragP = fpos; });

  if (!inFront()) return;

addEventListener("resize", applyView);
